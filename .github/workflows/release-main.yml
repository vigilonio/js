name: Release Main

# Manual trigger while the first public release is under review. Once the
# package is ready to ship on every merge, replace `workflow_dispatch` with:
#
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC) and provenance attestations.
  id-token: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    if: "${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          scope: "@vigilon"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validate before touching git or npm state, so a failing build or test
      # leaves nothing behind to recover from.
      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Smoke-test packed tarballs
        run: pnpm smoke

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, tag, and push (lockstep)
        run: |
          version=$(node -p "require('./packages/node/package.json').version")
          is_tagged()    { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          is_published() { npm view "@vigilon/node@$1" version >/dev/null 2>&1; }

          # Bump only when the current version has fully shipped (tagged and
          # on npm). A hand-set, untagged version releases as-is; a tagged
          # version missing from npm is a failed publish being retried, and
          # also releases as-is. Tags are annotated: `--follow-tags` and
          # lightweight tags silently do not mix.
          if is_tagged "$version" && is_published "$version"; then
            pnpm -r exec npm version patch --no-git-tag-version
            version=$(node -p "require('./packages/node/package.json').version")
            git commit -am "chore(release): $version"
          fi
          if is_tagged "$version"; then
            # Retrying a tagged-but-unpublished version: the tarball and its
            # provenance must come from the tagged commit, so refuse to
            # publish a HEAD that has moved on since the tag was pushed.
            tagged=$(git rev-parse "refs/tags/v$version^{commit}")
            head=$(git rev-parse HEAD)
            if [ "$tagged" != "$head" ]; then
              echo "::error::v$version is tagged at $tagged but HEAD is $head. Publish from the tagged commit, or delete the tag so the next release bumps past $version."
              exit 1
            fi
          else
            git tag -a "v$version" -m "v$version"
          fi

          # Git state is established before the irreversible npm publish. If
          # main moved during the run this push fails, nothing is published,
          # and a rerun starts clean. --atomic: branch and tag land together
          # or not at all.
          git push --atomic origin HEAD:main "refs/tags/v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish packages to npm
        # Bootstrap: npm trusted publishing can only be configured for a
        # package that already exists on the registry, so the very first
        # version of a new package must be published manually with
        # `scripts/publish.sh latest` from a logged-in machine, and its
        # annotated v<version> tag pushed by hand. After that, add this
        # workflow as a trusted publisher on npmjs.com and the OIDC publish
        # below works with no token.
        run: bash scripts/publish.sh latest
